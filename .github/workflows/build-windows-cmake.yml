---
name: Build - Windows - CMake
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - ".github/workflows/build-windows-cmake.yml"
      - "vcpkg.json"
      - "CMakePresets.json"
  merge_group:
  push:
    paths:
      - "src/**"
      - ".github/workflows/build-windows-cmake.yml"
      - "vcpkg.json"
      - "CMakePresets.json"
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: server-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_MAX_CONCURRENCY: 2
  VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg/downloads
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
  SCCACHE_LOG: warn
  SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache-error.log

jobs:
  job:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    name: windows-2022-windows-release
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read pinned vcpkg baseline
        id: baseline
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          if ($commit -notmatch '^[0-9a-f]{40}$') {
            throw 'vcpkg builtin-baseline must be a full 40-character commit SHA.'
          }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          New-Item -ItemType Directory -Force -Path .vcpkg-binary-cache, vcpkg/downloads | Out-Null

      - name: Restore compiled dependency cache
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-binary-cache
            ${{ github.workspace }}/vcpkg/downloads
          key: crystal-vcpkg-windows-static-${{ steps.baseline.outputs.commit }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            crystal-vcpkg-windows-static-${{ steps.baseline.outputs.commit }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-v1-
            crystal-vcpkg-windows-static-${{ steps.baseline.outputs.commit }}-${{ hashFiles('vcpkg.json') }}-
            crystal-vcpkg-windows-static-

      - name: Configure compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          max-size: 1G
          variant: sccache
          key: crystal-windows-release
          restore-keys: crystal-windows

      - name: Remove Windows pre-installed MySQL
        shell: pwsh
        run: Remove-Item -Recurse -Force C:\mysql* -ErrorAction SilentlyContinue

      - name: Install pinned vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: ${{ steps.baseline.outputs.commit }}
          vcpkgJsonGlob: vcpkg.json

      - name: Set up CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      - name: Configure and restore dependencies
        id: configure
        shell: pwsh
        run: cmake --preset windows-release

      - name: Save compiled dependency cache
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/.vcpkg-binary-cache
            ${{ github.workspace }}/vcpkg/downloads
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Build server
        shell: pwsh
        run: cmake --build --preset windows-release --parallel 2

      - name: Record compiler cache statistics
        if: always()
        shell: pwsh
        run: |
          sccache --show-stats | Tee-Object -FilePath sccache-stats.txt
          Get-Content sccache-stats.txt >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-crystalserver-windows-release-${{ github.sha }}
          path: |
            sccache-stats.txt
            sccache-error.log
            build/windows-release/CMakeCache.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: crystalserver-windows-release-${{ github.sha }}
          path: ${{ github.workspace }}/build/windows-release/bin/
          if-no-files-found: error
